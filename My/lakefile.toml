name = "puppeteer"
version = "0.1.0"
defaultTargets = ["puppeteer"]
testDriver = "test_runner"

[leanOptions]
weak.linter.mathlibStandardSet = true
weak.linter.flexible = true
weak.linter.pythonStyle = false
weak.linter.checkInitImports = false
weak.linter.allScriptsDocumented = false
weak.linter.unicodeLinter = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[lean_lib]]
name = "My"
roots = ["My"]

[[lean_exe]]
name = "puppeteer"
root = "My.Main"
supportInterpreter = true

[[lean_exe]]
name = "mk_all"
root = "My.Tools.MkAll"

[[lean_exe]]
name = "checkInitImports"
root = "My.Tools.CheckInitImports"

[[lean_exe]]
name = "test_runner"
root = "My.PuppeteerTests"
